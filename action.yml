name: 'Vibgrate Scan'
description: 'Stop dependency drift entering your main branch. Scans every pull request for a 0-100 DriftScore and uploads SARIF to GitHub Security. No account needed.'
author: 'Vibgrate'

branding:
  icon: 'shield'
  color: 'green'

inputs:
  path:
    description: 'Path to scan.'
    required: false
    default: '.'
  format:
    description: 'Output format (sarif, json, md, ...).'
    required: false
    default: 'sarif'
  output:
    description: 'Output file path.'
    required: false
    default: 'vibgrate.sarif'
  fail-on:
    description: 'Fail the job on findings of this severity or higher (e.g. "error"). Empty = never fail on findings.'
    required: false
    default: ''
  max-score:
    description: 'Fail the job when the DriftScore is above this budget, a number from 0 to 100 (lower is better). Values outside 0-100 fail the step. Empty = never fail on the score. Maps to --drift-budget.'
    required: false
    default: ''
  baseline:
    description: 'Repo-relative path to a committed baseline (create one with `vg baseline` and commit .vibgrate/baseline.json). Enables the change-since-baseline outputs and the max-worsening gate.'
    required: false
    default: ''
  max-worsening:
    description: 'Fail the job when drift worsens by more than this percent since the baseline (a number >= 0). Requires baseline. Empty = never fail on worsening. Maps to --drift-worsening.'
    required: false
    default: ''
  summary:
    description: 'Path of the small JSON summary the scan writes (DriftScore, risk level, change since baseline). Needs a scanner image that supports --summary-out; older images skip it with a notice.'
    required: false
    default: 'vibgrate-summary.json'
  vulns:
    description: 'Also scan installed dependencies for known vulnerabilities (adds --vulns). With fetch-depth:0 on checkout, findings are attributed to the introducing commit.'
    required: false
    default: 'false'
  upload-sarif:
    description: 'Upload the SARIF to GitHub code scanning. Only applies when format is "sarif"; the calling workflow needs `permissions: security-events: write`.'
    required: false
    default: 'false'
  category:
    description: 'Category for the uploaded SARIF, so multiple Vibgrate scans coexist in code scanning.'
    required: false
    default: 'vibgrate'
  args:
    description: 'Additional raw arguments appended to `vibgrate scan`.'
    required: false
    default: ''
  dsn:
    description: 'Optional VIBGRATE_DSN to push results to your workspace dashboard.'
    required: false
    default: ''
  image-tag:
    description: 'Scanner image tag to run (defaults to a pinned, tested release).'
    required: false
    default: '2026.1007.1' # vibgrate:cli-version — stamped by scripts/stamp-release-pins.mjs
  verify:
    description: 'Verify the image cosign signature + provenance before running (requires cosign on the runner).'
    required: false
    default: 'false'

outputs:
  output-file:
    description: 'Path to the written scan output file.'
    value: ${{ steps.scan.outputs.output-file }}
  drift-score:
    description: 'DriftScore, 0-100 (lower is better). Empty when drift could not be measured or the scanner image is too old to write a summary.'
    value: ${{ steps.summary.outputs.drift-score }}
  risk-level:
    description: 'Risk level for the DriftScore (low, moderate or high). Empty when unavailable.'
    value: ${{ steps.summary.outputs.risk-level }}
  score-delta:
    description: 'Change in DriftScore since the baseline (positive = worse). Empty without a baseline comparison.'
    value: ${{ steps.summary.outputs.score-delta }}
  summary-file:
    description: 'Path to the written summary JSON, when one was produced.'
    value: ${{ steps.summary.outputs.summary-file }}

# Composite action that runs the cosign-signed scanner container, so users of the
# Action inherit the exact provenance chain we publish. See
# docs/ARTIFACT-DISTRIBUTION-STRATEGY.md §3.5. Inputs are passed via env (never
# interpolated into the shell) to avoid script injection.
runs:
  using: composite
  steps:
    - name: Verify image provenance
      if: inputs.verify == 'true'
      shell: bash
      env:
        IMAGE: ghcr.io/vibgrate/cli
        INPUT_TAG: ${{ inputs.image-tag }}
      run: |
        set -euo pipefail
        if ! command -v cosign >/dev/null 2>&1; then
          # The user explicitly opted into verification — running unverified
          # anyway would silently void that choice. Fail with the fix.
          echo "::error::verify=true but cosign is not on the runner — add sigstore/cosign-installer before this Action (or set verify: false)."
          exit 1
        fi
        cosign verify "${IMAGE}:${INPUT_TAG}" \
          --certificate-identity-regexp 'https://github.com/vibgrate/cli/.github/workflows/.+' \
          --certificate-oidc-issuer https://token.actions.githubusercontent.com

    - name: Run Vibgrate scan
      id: scan
      shell: bash
      env:
        IMAGE: ghcr.io/vibgrate/cli
        INPUT_TAG: ${{ inputs.image-tag }}
        INPUT_PATH: ${{ inputs.path }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_OUTPUT: ${{ inputs.output }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_MAX_SCORE: ${{ inputs.max-score }}
        INPUT_BASELINE: ${{ inputs.baseline }}
        INPUT_MAX_WORSENING: ${{ inputs.max-worsening }}
        INPUT_SUMMARY: ${{ inputs.summary }}
        INPUT_VULNS: ${{ inputs.vulns }}
        INPUT_ARGS: ${{ inputs.args }}
        VIBGRATE_DSN: ${{ inputs.dsn }}
      run: |
        set -euo pipefail
        extra=()
        if [ -n "${INPUT_FAIL_ON}" ]; then
          extra+=(--fail-on "${INPUT_FAIL_ON}")
        fi
        if [ -n "${INPUT_MAX_SCORE}" ]; then
          # Trim surrounding whitespace, then enforce the documented 0-100 range:
          # a budget above 100 can never fail, so a typo would turn the gate off.
          max_score="${INPUT_MAX_SCORE#"${INPUT_MAX_SCORE%%[![:space:]]*}"}"
          max_score="${max_score%"${max_score##*[![:space:]]}"}"
          if ! [[ "${max_score}" =~ ^[0-9]+(\.[0-9]+)?$ ]] ||
            ! awk -v score="${max_score}" 'BEGIN { exit !(score + 0 <= 100) }'; then
            echo "::error::max-score must be a number from 0 to 100 (got '${INPUT_MAX_SCORE}')."
            exit 1
          fi
          extra+=(--drift-budget "${max_score}")
        fi
        if [ -n "${INPUT_MAX_WORSENING}" ]; then
          if ! [[ "${INPUT_MAX_WORSENING}" =~ ^[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::max-worsening must be a number of percent, 0 or more (got '${INPUT_MAX_WORSENING}')."
            exit 1
          fi
          if [ -z "${INPUT_BASELINE}" ]; then
            echo "::error::max-worsening needs a baseline to compare against — set baseline: .vibgrate/baseline.json (create it with 'vg baseline' and commit it)."
            exit 1
          fi
          extra+=(--drift-worsening "${INPUT_MAX_WORSENING}")
        fi
        if [ -n "${INPUT_BASELINE}" ]; then
          case "${INPUT_BASELINE}" in
            /*|../*|*/../*)
              echo "::error::baseline must be a path inside the repository (got '${INPUT_BASELINE}')."
              exit 1
              ;;
          esac
          if [ ! -f "${INPUT_BASELINE}" ]; then
            echo "::error::baseline file '${INPUT_BASELINE}' not found — run 'vg baseline' and commit .vibgrate/baseline.json, and check that actions/checkout ran first."
            exit 1
          fi
          extra+=(--baseline "${INPUT_BASELINE}")
        fi
        # The summary needs a scanner image that knows --summary-out. The default
        # image is pinned to a release; an older pin (or an older image-tag set by
        # the caller) would fail on an unknown flag, so probe before passing it.
        help_text="$(docker run --rm "${IMAGE}:${INPUT_TAG}" scan --help 2>/dev/null || true)"
        if grep -q -- '--summary-out' <<<"${help_text}"; then
          extra+=(--summary-out "${INPUT_SUMMARY}")
          echo "summary-written=true" >> "$GITHUB_OUTPUT"
        else
          echo "::notice::image ${INPUT_TAG} predates --summary-out; the drift-score outputs will be empty. Use a newer image-tag to get them."
        fi
        if [ "${INPUT_VULNS}" = "true" ]; then
          extra+=(--vulns)
        fi
        if [ -n "${INPUT_ARGS}" ]; then
          # Word-split intentionally: callers pass extra flags as a string.
          # Globbing stays off so a pattern like `--only *.ts` reaches the CLI
          # verbatim instead of expanding against the workspace.
          set -f
          # shellcheck disable=SC2206
          extra+=(${INPUT_ARGS})
          set +f
        fi
        # Declare the output before the scan: `fail-on` exits non-zero on
        # findings, and downstream consumers still need the artifact path.
        echo "output-file=${INPUT_OUTPUT}" >> "$GITHUB_OUTPUT"
        # `--no-graph`: this Action's job is the CI scan result — the DriftScore
        # and findings it emits as SARIF. The code map (`.vibgrate/graph.json`) is a
        # separate local artifact most CI runs don't consume, so it stays off by
        # default here to keep the run lean and leave the workspace clean. Opt in
        # any time with `args: --graph` (appended after, last wins).
        docker run --rm \
          --user "$(id -u):$(id -g)" \
          -e HOME=/tmp \
          -v "${PWD}:/work" -w /work \
          ${VIBGRATE_DSN:+-e VIBGRATE_DSN} \
          "${IMAGE}:${INPUT_TAG}" \
          scan "${INPUT_PATH}" \
          --format "${INPUT_FORMAT}" \
          --out "${INPUT_OUTPUT}" \
          --no-graph \
          "${extra[@]}"

    # Expose the score. `always()` so a run that failed its budget still reports
    # the number that failed it. Needs jq (present on GitHub-hosted runners);
    # without it the outputs stay empty rather than guessed.
    - name: Expose DriftScore
      id: summary
      if: ${{ always() && steps.scan.outputs.summary-written == 'true' }}
      shell: bash
      env:
        INPUT_SUMMARY: ${{ inputs.summary }}
      run: |
        set -euo pipefail
        if [ ! -f "${INPUT_SUMMARY}" ]; then
          echo "::notice::the scan did not write ${INPUT_SUMMARY}, so the drift-score outputs are empty."
          exit 0
        fi
        if ! command -v jq >/dev/null 2>&1; then
          echo "::notice::jq is not on this runner, so the drift-score outputs are empty. The summary is still written to ${INPUT_SUMMARY}."
          echo "summary-file=${INPUT_SUMMARY}" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        score="$(jq -r '.driftScore // empty' "${INPUT_SUMMARY}")"
        risk="$(jq -r '.riskLevel // empty' "${INPUT_SUMMARY}")"
        delta="$(jq -r '.delta // empty' "${INPUT_SUMMARY}")"
        {
          echo "summary-file=${INPUT_SUMMARY}"
          echo "drift-score=${score}"
          echo "risk-level=${risk}"
          echo "score-delta=${delta}"
        } >> "$GITHUB_OUTPUT"
        if [ -n "${score}" ]; then
          line="DriftScore ${score}/100 (${risk})"
          if [ -n "${delta}" ]; then line="${line}, ${delta} since baseline"; fi
          echo "${line}" >> "$GITHUB_STEP_SUMMARY"
        fi

    # Surface findings in the Security tab. `always()` so the SARIF still uploads
    # when `fail-on` failed the scan step — the PR check goes red AND the findings
    # are visible. Needs `permissions: security-events: write` on the workflow.
    - name: Upload SARIF to code scanning
      if: ${{ always() && inputs.upload-sarif == 'true' && inputs.format == 'sarif' }}
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ inputs.output }}
        category: ${{ inputs.category }}
