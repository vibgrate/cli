# Package, sign, and publish the Vibgrate Helm chart to GHCR (OCI), and refresh
# the Artifact Hub repository metadata.
#
# Runs in the org-owned github.com/vibgrate/cli repo so the chart publishes to the
# canonical ghcr.io/vibgrate/charts/vibgrate (not the private monorepo's owner).
# Provenance is a gate: the chart is cosign-signed (keyless) and the final step
# re-verifies the signature. The chart version is semver (read from Chart.yaml —
# the source of truth) and iterates independently of the CLI's calendar version.
#
# Triggers:
#   - push to main           → publish when charts/vibgrate/Chart.yaml's
#                              `version` changed (a merged chart-bump / sync PR)
#                              OR when package.json's version changed (a CLI
#                              release). A CLI-only bump auto-increments the
#                              chart patch so OCI accepts a new tag and the
#                              published chart's appVersion tracks the image.
#   - workflow_dispatch      → manual run (with a dry-run option)
#
# REQUIRED for anonymous `helm pull` (one-time if the API cannot flip it):
#   Org owner → https://github.com/orgs/vibgrate/packages/container/charts/vibgrate/settings
#   → Change visibility → Public.
# OPTIONAL secret on github.com/vibgrate/cli:
#   PACKAGES_ADMIN_TOKEN — PAT with admin on GHCR packages (write:packages +
#   the org package-admin grant). When set, the visibility step uses it
#   instead of GITHUB_TOKEN, which often cannot make an org package public.
name: Helm

on:
  push:
    branches: [main]
    paths:
      - "charts/**"
      - "package.json"
      - ".github/workflows/helm.yml"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Dry run (lint + package + template, skip push & sign)"
        required: false
        default: false
        type: boolean

concurrency:
  group: helm-${{ github.ref }}
  cancel-in-progress: false

env:
  CHART_DIR: charts/vibgrate
  OCI_REPO: oci://ghcr.io/${{ github.repository_owner }}/charts
  CHART_REF: ghcr.io/${{ github.repository_owner }}/charts/vibgrate

jobs:
  gate:
    name: Decide release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release: ${{ steps.decide.outputs.release }}
      bump_chart: ${{ steps.decide.outputs.bump_chart }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          release=false
          bump_chart=false
          if [ "$EVENT" = "workflow_dispatch" ]; then
            release=true
          elif [ "$EVENT" = "push" ]; then
            NEW="$(grep -E '^version:' "${CHART_DIR}/Chart.yaml" | awk '{print $2}' | tr -d '"')"
            OLD="$(git show "${BEFORE}:${CHART_DIR}/Chart.yaml" 2>/dev/null | grep -E '^version:' | awk '{print $2}' | tr -d '"' || echo "")"
            if [ "$NEW" != "$OLD" ] && [ -n "$NEW" ]; then
              release=true
            else
              NEW_PKG="$(jq -r .version package.json)"
              OLD_PKG="$(git show "${BEFORE}:package.json" 2>/dev/null | jq -r .version || echo "")"
              if [ "$NEW_PKG" != "$OLD_PKG" ] && [ -n "$NEW_PKG" ] && [ "$NEW_PKG" != "null" ]; then
                release=true
                bump_chart=true
              fi
            fi
          fi
          echo "release=${release}" >> "$GITHUB_OUTPUT"
          echo "bump_chart=${bump_chart}" >> "$GITHUB_OUTPUT"
          if [ "$release" = "true" ]; then
            echo "### Helm chart — will publish" >> "$GITHUB_STEP_SUMMARY"
            if [ "$bump_chart" = "true" ]; then
              echo "CLI version changed without a chart version bump — will increment the chart patch so OCI accepts a new tag." >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "No chart or CLI version change on this push — Helm publish skipped." >> "$GITHUB_STEP_SUMMARY"
          fi

  publish:
    name: Package, push & sign
    needs: gate
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Read chart version
        id: chart
        run: |
          set -euo pipefail
          ver=$(grep -E '^version:' "${CHART_DIR}/Chart.yaml" | awk '{print $2}' | tr -d '"')
          if [ "${{ needs.gate.outputs.bump_chart }}" = "true" ]; then
            # CLI release without a committed chart bump: increment the patch
            # so helm push creates a new OCI tag (re-pushing 0.1.1 would 409).
            IFS=. read -r major minor patch <<< "${ver}"
            patch=$((patch + 1))
            ver="${major}.${minor}.${patch}"
            sed -i -E "s/^(version: ).*/\\1${ver}/" "${CHART_DIR}/Chart.yaml"
            echo "Bumped Chart.yaml version to \`${ver}\` for this CLI release." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "version=${ver}" >> "$GITHUB_OUTPUT"
          echo "### Chart version: \`${ver}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Lint
        run: helm lint "${CHART_DIR}" --strict -f "${CHART_DIR}/ci/test-values.yaml"

      - name: Render (template smoke test)
        run: helm template vibgrate "${CHART_DIR}" -f "${CHART_DIR}/ci/test-values.yaml" > /dev/null

      - name: Package
        run: helm package "${CHART_DIR}" --destination .

      - name: Log in to GHCR
        if: github.event_name != 'workflow_dispatch' || inputs.dry-run == false
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push to OCI registry
        id: push
        if: github.event_name != 'workflow_dispatch' || inputs.dry-run == false
        run: |
          set -euo pipefail
          helm push "vibgrate-${{ steps.chart.outputs.version }}.tgz" "${OCI_REPO}" 2> push.log
          cat push.log
          digest=$(grep -oE 'sha256:[0-9a-f]{64}' push.log | head -1)
          if [ -z "${digest}" ]; then echo "::error::could not determine pushed digest"; exit 1; fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Make GHCR chart package public
        if: github.event_name != 'workflow_dispatch' || inputs.dry-run == false
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_ADMIN_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          OWNER="${{ github.repository_owner }}"
          set +e
          node scripts/ghcr-set-visibility.mjs --owner "${OWNER}" --package charts/vibgrate
          status=$?
          set -e
          if [ "${status}" -eq 0 ]; then
            echo "GHCR package \`ghcr.io/${OWNER}/charts/vibgrate\` is public." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Could not set ghcr.io/${OWNER}/charts/vibgrate public. Org owner: https://github.com/orgs/${OWNER}/packages/container/charts/vibgrate/settings → Change visibility → Public. Optional: set PACKAGES_ADMIN_TOKEN on this repo (package-admin PAT) so future runs flip it automatically."
            echo "> **Chart package still private** — anonymous \`helm pull oci://ghcr.io/${OWNER}/charts/vibgrate\` will 401 until visibility is Public." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install cosign
        if: github.event_name != 'workflow_dispatch' || inputs.dry-run == false
        uses: sigstore/cosign-installer@v3

      - name: Sign chart (keyless)
        if: github.event_name != 'workflow_dispatch' || inputs.dry-run == false
        env:
          COSIGN_YES: "true"
        run: cosign sign "${CHART_REF}@${{ steps.push.outputs.digest }}"

      - name: Verify signature (gate)
        if: github.event_name != 'workflow_dispatch' || inputs.dry-run == false
        run: |
          cosign verify "${CHART_REF}@${{ steps.push.outputs.digest }}" \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}/.github/workflows/.+" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"

      - name: Push Artifact Hub metadata
        if: github.event_name != 'workflow_dispatch' || inputs.dry-run == false
        run: |
          set -euo pipefail
          if grep -qE '^repositoryID:\s*""\s*$' charts/artifacthub-repo.yml; then
            echo "Artifact Hub repositoryID not set yet — skipping metadata push." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          oras push "${CHART_REF}:artifacthub.io" \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            charts/artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml

      - name: Tag release
        if: github.event_name != 'workflow_dispatch' || inputs.dry-run == false
        run: |
          TAG="vibgrate-helm/v${{ steps.chart.outputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists — skipping." >> "$GITHUB_STEP_SUMMARY"
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Commit auto-bumped chart version
        if: needs.gate.outputs.bump_chart == 'true' && (github.event_name != 'workflow_dispatch' || inputs.dry-run == false)
        run: |
          set -euo pipefail
          if git diff --quiet -- "${CHART_DIR}/Chart.yaml"; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${CHART_DIR}/Chart.yaml"
          git commit -m "chore(release): bump Helm chart to v${{ steps.chart.outputs.version }} [skip ci]"
          if git push origin HEAD:main; then
            echo "Committed chart version \`${{ steps.chart.outputs.version }}\` to main." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Could not push the auto-bumped Chart.yaml (branch protection?). Open a PR pinning charts/vibgrate/Chart.yaml version to ${{ steps.chart.outputs.version }}."
          fi

      - name: Summary
        run: |
          {
            echo "### Helm chart"
            if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry-run }}" = "true" ]; then
              echo "> **Dry run** — chart linted & packaged, not pushed."
            else
              echo "- Chart: \`${CHART_REF}:${{ steps.chart.outputs.version }}\`"
              echo "- Digest: \`${{ steps.push.outputs.digest }}\`"
              echo "- Signed (cosign keyless) and verified."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
