# Dependabot for the public mirror (github.com/vibgrate/cli).
#
# This repository is a synced REPLICA of packages/vibgrate-cli-public in the
# Vibgrate monorepo, which is the canonical source of truth. Every file here —
# package.json, pnpm-lock.yaml and the workflows under .github/workflows/ — is
# overwritten on the next sync from the monorepo, so a version-bump PR opened
# here cannot be landed meaningfully: merging it would be reverted by the next
# sync, and the monorepo's own Dependabot already covers the same manifests
# (and regenerates this package's standalone lockfile, which a PR opened here
# would not do).
#
# Version updates are therefore DISABLED in this repo via
# `open-pull-requests-limit: 0`. Dependabot security updates and alerts stay
# active — that is a repository setting, not controlled by this file — so a
# vulnerable dependency is still surfaced here; the fix is made in the monorepo
# and arrives with the next release sync.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # 0 disables version-update PRs for this ecosystem while leaving security
    # updates enabled.
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
    ignore:
      # web-tree-sitter 0.26.x changed the WASM ABI: the precompiled grammars in
      # tree-sitter-wasms@0.1.x only load under 0.25.x, so 0.26+ breaks every
      # grammar load (all parsing). There is no security advisory on 0.25.x.
      # Kept so a security update never proposes the ABI-breaking line.
      # Re-evaluate when tree-sitter-wasms ships 0.26-ABI grammars.
      - dependency-name: "web-tree-sitter"
        versions: [">= 0.26.0"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # The workflows are synced from the monorepo too; action pins are bumped
    # there by the monorepo's Dependabot.
    open-pull-requests-limit: 0
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "github-actions"
